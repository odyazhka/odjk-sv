[package]
name = "odjk-sv"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "odjk-sv"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort" 
